<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>אקדמיית הדרקונים של עומר</title>
    <style>
        :root {
            --bg-dark: #121a23;
            --bg-card: #1f2c3a;
            --accent-orange: #e67e22;
            --accent-gold: #f1c40f;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --text-light: #ecf0f1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* סרגל עליון */
        header {
            background-color: #0b1116;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-orange);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .mute-btn {
            background: var(--bg-card);
            border: 2px solid #7f8c8d;
            color: white;
            font-size: 1.4rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .gallery-btn {
            background: linear-gradient(135deg, var(--accent-blue), #2980b9);
            color: white;
            border: 2px solid #85c1e9;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 #154360;
        }

        .gallery-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        main {
            flex: 1;
            padding: 16px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }
        .screen.active { display: flex; }

        h1, h2, h3 { margin: 0; text-align: center; }

        /* קופסת דמות משופרת - טקסט קצר וגדול, תמונה ממורכזת */
        .guide-box {
            background-color: var(--bg-card);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .guide-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #2c3e50; /* רקע ניטרלי למקרה של שקיפות */
            border: 3px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .guide-avatar img {
            width: 90%;
            height: 90%;
            object-fit: contain; /* שומר שהראש לא ייחתך */
            object-position: center;
        }

        .guide-text {
            font-size: 1.4rem; /* פונט הרבה יותר גדול */
            font-weight: bold;
            line-height: 1.2;
        }

        /* רשת המספרים במסך הבית */
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 10px;
        }
        @media (max-width: 500px) {
            .numbers-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .num-btn {
            background: var(--bg-card);
            border: 3px solid var(--accent-blue);
            color: white;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 20px 10px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1f618d;
        }
        .num-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* ניווט שלבים */
        .stage-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }
        .stage-tab {
            flex: 1;
            padding: 12px 6px;
            background: #0b1116;
            border: 2px solid #34495e;
            color: #7f8c8d;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            cursor: pointer;
        }
        .stage-tab.active {
            background: var(--accent-blue);
            color: white;
            border-color: white;
        }

        /* בר התקדמות חשיפת פוסטר */
        .poster-progress-container {
            background: #0b1116;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #34495e;
        }
        .progress-bar-bg {
            flex: 1;
            height: 12px;
            background: #1f2c3a;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-gold);
            min-width: 50px;
        }

        /* שלב 1: סדרה אקטיבית */
        .sequence-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 16px 0;
            min-height: 120px;
            align-items: center;
        }
        .seq-box {
            background: var(--accent-blue);
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 12px;
            border: 2px solid #85c1e9;
            box-shadow: 0 4px 0 #154360;
        }
        .seq-arrow {
            color: var(--accent-gold);
            font-size: 1.5rem;
            font-weight: bold;
        }
        .seq-target {
            background: var(--bg-card);
            color: var(--accent-gold);
            border: 3px dashed var(--accent-gold);
            font-size: 2rem;
            min-width: 70px;
            text-align: center;
        }

        /* שלב 2: שאלות ורמזים */
        .question-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            border: 3px solid #34495e;
            margin: 4px 0;
        }
        .question-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--accent-gold);
            direction: ltr;
        }
        .hint-box {
            margin-top: 16px;
            padding: 12px;
            background: rgba(231, 76, 60, 0.15);
            border: 2px solid var(--accent-red);
            border-radius: 12px;
            font-size: 1.2rem;
            display: none;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .ans-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 20px;
            font-size: 2.2rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1f618d;
        }
        .ans-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* מקלדת (לשלב 1 ו-3) */
        .numpad-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            margin: 8px auto 0 auto;
            width: 100%;
        }
        .numpad-display {
            background: #0b1116;
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            height: 60px;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            direction: ltr;
        }
        .pad-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1a252f;
        }
        .pad-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        .pad-btn.submit { background: var(--accent-green); box-shadow: 0 5px 0 #1e8449; }
        .pad-btn.clear { background: var(--accent-red); box-shadow: 0 5px 0 #922b21; }

        .back-btn {
            background: transparent;
            border: 2px solid #7f8c8d;
            color: #bdc3c7;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        /* מודלים ופוסטרים */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            padding: 20px;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        
        .modal-content {
            background: var(--bg-card);
            border: 3px solid var(--accent-gold);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            text-align: center;
            position: relative;
        }

        /* גלריית פוסטרים */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 20px;
        }
        @media (min-width: 600px) { .gallery-grid { grid-template-columns: repeat(4, 1fr); } }

        .poster-frame {
            border: 3px solid #34495e;
            border-radius: 12px;
            background: #0b1116;
            overflow: hidden;
            position: relative;
            aspect-ratio: 2/3;
            display: flex;
            flex-direction: column;
        }
        .poster-frame.unlocked { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(241, 196, 15, 0.4); }
        
        .poster-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
        }

        .poster-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .poster-overlay-title {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.2);
            font-weight: bold;
        }

        /* רשת אריחים לשבירה */
        .tiles-grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            z-index: 3;
        }
        .puzzle-tile {
            background: #2c3e50;
            border: 1px solid #1a252f;
            transition: opacity 0.3s, transform 0.3s;
        }
        .puzzle-tile.broken {
            opacity: 0;
            transform: scale(0.5);
            pointer-events: none;
        }

        .close-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 0 #922b21;
        }
        .close-btn:active { transform: translateY(4px); box-shadow: none; }

        /* קונפטי */
        .confetti {
            position: fixed; width: 12px; height: 12px; z-index: 100;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
        <button class="gallery-btn" onclick="openGallery()">
            🖼️ גלריית הפוסטרים
        </button>
    </header>

    <main>
        <!-- מסך 1: בחירת מספר -->
        <div id="homeScreen" class="screen active">
            <div class="guide-box">
                <div class="guide-avatar" id="homeAvatar"></div>
                <div class="guide-text">בחר מספר לאימון:</div>
            </div>
            <div class="numbers-grid" id="numbersGrid"></div>
        </div>

        <!-- מסך 2: זירת האימון -->
        <div id="practiceScreen" class="screen">
            <div class="stage-tabs">
                <div class="stage-tab active" id="tab1" onclick="setStage(1)">1. הסדרה</div>
                <div class="stage-tab" id="tab2" onclick="setStage(2)">2. תשובות</div>
                <div class="stage-tab" id="tab3" onclick="setStage(3)">3. הקלדה</div>
            </div>

            <div class="poster-progress-container">
                <div>🖼️</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="posterProgressBar"></div>
                </div>
                <div class="progress-text" id="posterProgressText">0/20</div>
            </div>

            <div class="guide-box">
                <div class="guide-avatar" id="stageAvatar"></div>
                <div class="guide-text" id="stageGuideText"></div>
            </div>

            <!-- שלב 1: סדרה אקטיבית -->
            <div id="stage1Content" style="display: none;">
                <div class="sequence-container" id="sequenceContainer"></div>
            </div>

            <!-- שלב 2: אמריקאי -->
            <div id="stage2Content" style="display: none;">
                <div class="question-card">
                    <div class="question-text" id="questionText2">?</div>
                    <div class="hint-box" id="hintBox"></div>
                </div>
                <div class="answers-grid" id="answersGrid"></div>
            </div>

            <!-- שלב 3 (ו-1): שאלת הקלדה -->
            <div id="stage3Content" style="display: none;">
                <div class="question-card">
                    <div class="question-text" id="questionText3">?</div>
                </div>
            </div>

            <!-- מקלדת וירטואלית משותפת לשלב 1 ולשלב 3 -->
            <div class="numpad-container" id="numpadContainer" style="display: none;">
                <div class="numpad-display" id="numpadDisplay">?</div>
                <div class="numpad-grid">
                    <button class="pad-btn" onclick="pressPad('1')">1</button>
                    <button class="pad-btn" onclick="pressPad('2')">2</button>
                    <button class="pad-btn" onclick="pressPad('3')">3</button>
                    <button class="pad-btn" onclick="pressPad('4')">4</button>
                    <button class="pad-btn" onclick="pressPad('5')">5</button>
                    <button class="pad-btn" onclick="pressPad('6')">6</button>
                    <button class="pad-btn" onclick="pressPad('7')">7</button>
                    <button class="pad-btn" onclick="pressPad('8')">8</button>
                    <button class="pad-btn" onclick="pressPad('9')">9</button>
                    <button class="pad-btn clear" onclick="pressPad('C')">מחק</button>
                    <button class="pad-btn" onclick="pressPad('0')">0</button>
                    <button class="pad-btn submit" onclick="submitPad()">אישור</button>
                </div>
            </div>

            <button class="back-btn" onclick="goHome()">⬅ חזור למספרים</button>
        </div>
    </main>

    <!-- גלריית פוסטרים -->
    <div id="galleryModal" class="modal">
        <div class="modal-content">
            <h2>🖼️ הפוסטרים הסודיים 🖼️</h2>
            <div class="gallery-grid" id="galleryGrid"></div>
            <button class="close-btn" onclick="closeGallery()">סגור</button>
        </div>
    </div>

    <!-- הודעת פוסטר נחשף -->
    <div id="posterRevealModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <h1 style="font-size: 2.5rem; color: var(--accent-gold);">🎉 מדהים! 🎉</h1>
            <h2>חשפת את הפוסטר של <span id="revealNumberSpan"></span>!</h2>
            <div class="poster-frame unlocked" style="margin: 20px auto; width: 250px;">
                <img class="poster-image" id="revealPosterImg" src="">
            </div>
            <button class="close-btn" onclick="closePosterReveal()">המשך לאמן!</button>
        </div>
    </div>

    <script>
        /* 
           הגדרות תמונות: 
           כדי שהכל יעבוד חלק לגמרי, שמור בתיקיית הגיטהאב שלך את הקבצים הבאים:
           1. hiccup.png, astrid.png, fishlegs.png (למדריכים).
           2. poster1.jpg, poster2.jpg ... poster10.jpg (הפוסטרים של המספרים).
        */
        const GUIDES_DB = {
            hiccup: { name: 'היקאפ', emoji: '⚔️', img: 'hiccup.png', fallback: 'https://static.wikia.nocookie.net/howtotrainyourdragon/images/8/87/Hiccup_HTTYD3_transparent.png' },
            astrid: { name: 'אסטריד', emoji: '🛡️', img: 'astrid.png', fallback: 'https://static.wikia.nocookie.net/howtotrainyourdragon/images/5/5c/Astrid_HTTYD3_transparent.png' },
            fishlegs: { name: 'פישלגס', emoji: '📖', img: 'fishlegs.png', fallback: 'https://static.wikia.nocookie.net/howtotrainyourdragon/images/6/63/Fishlegs_HTTYD3_transparent.png' }
        };

        const TOTAL_TILES = 20;
        
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
            if (!isMuted) playSound('pop');
        }

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'success') {
                [523.25, 659.25, 880.00].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08); gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.2);
                });
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'fanfare') {
                const notes = [{ f: 523.25, t: 0, d: 0.15 }, { f: 659.25, t: 0.15, d: 0.15 }, { f: 783.99, t: 0.3, d: 0.15 }, { f: 1046.50, t: 0.45, d: 0.5 }];
                notes.forEach(n => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(n.f, now + n.t);
                    gain.gain.setValueAtTime(0.3, now + n.t); gain.gain.exponentialRampToValueAtTime(0.01, now + n.t + n.d);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now + n.t); osc.stop(now + n.t + n.d);
                });
            }
        }

        function launchConfetti() {
            const colors = ['#f1c40f', '#e67e22', '#2ecc71', '#3498db', '#e74c3c'];
            for (let i = 0; i < 50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                conf.style.animationDelay = (Math.random() * 0.2) + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3500);
            }
        }

        let playerStats = JSON.parse(localStorage.getItem('omer_posters_save_v2')) || { posters: {} };
        // אתחול 0 לכל מספר אם לא קיים
        for(let i=1; i<=10; i++) { if(playerStats.posters[i] === undefined) playerStats.posters[i] = 0; }

        let currentNumber = 5;
        let currentStage = 1;
        
        // משתני סדרה (שלב 1)
        let seqCurrentMultiplier = 2; 

        // משתני שאלות (שלב 2 ו-3)
        let currentMultiplier = 1;
        let currentAnswer = 0;
        let typedValue = '';

        function renderGuideAvatar(elementId, guideKey) {
            const guide = GUIDES_DB[guideKey];
            const el = document.getElementById(elementId);
            if (!el || !guide) return;
            el.innerHTML = `<img src="${guide.img}" alt="${guide.name}" referrerpolicy="no-referrer" onerror="this.src='${guide.fallback}'; this.onerror=function(){this.style.display='none'; this.parentElement.innerHTML='<span>${guide.emoji}</span>';}">`;
        }

        function saveGame() {
            localStorage.setItem('omer_posters_save_v2', JSON.stringify(playerStats));
            updateProgressBar();
        }

        function updateProgressBar() {
            const progress = playerStats.posters[currentNumber];
            const count = Math.min(progress, TOTAL_TILES);
            document.getElementById('posterProgressText').textContent = `${count}/${TOTAL_TILES}`;
            document.getElementById('posterProgressBar').style.width = `${(count / TOTAL_TILES) * 100}%`;
        }

        function addProgress() {
            if (playerStats.posters[currentNumber] < TOTAL_TILES) {
                playerStats.posters[currentNumber]++;
                saveGame();
                if (playerStats.posters[currentNumber] === TOTAL_TILES) {
                    setTimeout(() => showPosterReveal(), 400);
                }
            }
        }

        function showPosterReveal() {
            playSound('fanfare');
            launchConfetti();
            document.getElementById('revealNumberSpan').textContent = currentNumber;
            // מנסה לטעון את הפוסטר המקומי
            document.getElementById('revealPosterImg').src = `poster${currentNumber}.jpg`;
            document.getElementById('posterRevealModal').classList.add('active');
        }

        function closePosterReveal() {
            document.getElementById('posterRevealModal').classList.remove('active');
        }

        function initHome() {
            renderGuideAvatar('homeAvatar', 'hiccup');
            const grid = document.getElementById('numbersGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.textContent = i;
                // סממן אם הפוסטר הושלם
                if (playerStats.posters[i] >= TOTAL_TILES) {
                    btn.innerHTML = `${i} <span style="font-size:1rem">⭐</span>`;
                    btn.style.borderColor = 'var(--accent-gold)';
                }
                btn.onclick = () => { playSound('pop'); startNumberPractice(i); };
                grid.appendChild(btn);
            }
        }

        function startNumberPractice(num) {
            currentNumber = num;
            updateProgressBar();
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('practiceScreen').classList.add('active');
            setStage(1);
        }

        function goHome() {
            playSound('pop');
            document.getElementById('practiceScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
            initHome(); // לעדכן כוכבים
        }

        function setStage(stage) {
            currentStage = stage;
            document.querySelectorAll('.stage-tab').forEach((t, idx) => {
                t.classList.toggle('active', idx + 1 === stage);
            });

            const guideText = document.getElementById('stageGuideText');
            const s1 = document.getElementById('stage1Content');
            const s2 = document.getElementById('stage2Content');
            const s3 = document.getElementById('stage3Content');
            const numpad = document.getElementById('numpadContainer');

            s1.style.display = 'none';
            s2.style.display = 'none';
            s3.style.display = 'none';
            numpad.style.display = 'none';

            if (stage === 1) {
                renderGuideAvatar('stageAvatar', 'hiccup');
                guideText.textContent = `השלם את הסדרה:`;
                s1.style.display = 'block';
                numpad.style.display = 'flex';
                setupStage1();
            } else if (stage === 2) {
                renderGuideAvatar('stageAvatar', 'astrid');
                guideText.textContent = `בחר את התשובה:`;
                s2.style.display = 'block';
                nextQuestion();
            } else if (stage === 3) {
                renderGuideAvatar('stageAvatar', 'fishlegs');
                guideText.textContent = `הקלד את התשובה:`;
                s3.style.display = 'block';
                numpad.style.display = 'flex';
                nextQuestion();
            }
        }

        // ================= שלב 1: סדרה אקטיבית =================
        function setupStage1() {
            seqCurrentMultiplier = 2;
            typedValue = '';
            document.getElementById('numpadDisplay').textContent = '?';
            renderSequence();
        }

        function renderSequence() {
            const container = document.getElementById('sequenceContainer');
            container.innerHTML = '';
            
            // מראה את הקודמים (עד 3 אחרונים כדי לא להעמיס את המסך)
            let start = Math.max(1, seqCurrentMultiplier - 2);
            
            for (let i = start; i < seqCurrentMultiplier; i++) {
                const box = document.createElement('div');
                box.className = 'seq-box';
                box.textContent = currentNumber * i;
                container.appendChild(box);
                
                const arrow = document.createElement('div');
                arrow.className = 'seq-arrow';
                arrow.textContent = '➔';
                container.appendChild(arrow);
            }

            // תיבת היעד
            const target = document.createElement('div');
            target.className = 'seq-box seq-target';
            target.textContent = '?';
            container.appendChild(target);
            
            currentAnswer = currentNumber * seqCurrentMultiplier;
        }

        function checkStage1() {
            if (!typedValue) return;
            const numVal = parseInt(typedValue, 10);
            const display = document.getElementById('numpadDisplay');
            
            if (numVal === currentAnswer) {
                display.style.backgroundColor = 'var(--accent-green)';
                playSound('success');
                addProgress();
                
                setTimeout(() => {
                    display.style.backgroundColor = '#0b1116';
                    seqCurrentMultiplier++;
                    typedValue = '';
                    display.textContent = '?';
                    
                    if (seqCurrentMultiplier > 10) {
                        setStage(2); // סיים את הסדרה, עובר לשלב 2
                    } else {
                        renderSequence();
                    }
                }, 500);
            } else {
                display.style.backgroundColor = 'var(--accent-red)';
                playSound('error');
                setTimeout(() => {
                    display.style.backgroundColor = '#0b1116';
                    typedValue = '';
                    display.textContent = '?';
                }, 500);
            }
        }

        // ================= שלבים 2 ו-3: שאלות =================
        function nextQuestion() {
            document.getElementById('hintBox').style.display = 'none';
            currentMultiplier = Math.floor(Math.random() * 10) + 1;
            currentAnswer = currentNumber * currentMultiplier;
            
            const qText = `${currentNumber} × ${currentMultiplier} = ?`;
            
            if (currentStage === 2) {
                document.getElementById('questionText2').textContent = qText;
                setupMultipleChoice();
            } else {
                document.getElementById('questionText3').textContent = qText;
                typedValue = '';
                document.getElementById('numpadDisplay').textContent = '?';
            }
        }

        function setupMultipleChoice() {
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';
            
            const options = new Set([currentAnswer]);
            while (options.size < 4) {
                const randMult = Math.floor(Math.random() * 10) + 1;
                let wrongAns = currentNumber * randMult;
                if (wrongAns === currentAnswer) {
                    wrongAns = currentAnswer + (Math.random() > 0.5 ? currentNumber : -currentNumber);
                }
                if (wrongAns > 0) options.add(wrongAns);
            }

            const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
            shuffled.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'ans-btn';
                btn.textContent = opt;
                btn.onclick = () => {
                    if (opt === currentAnswer) {
                        btn.style.backgroundColor = 'var(--accent-green)';
                        playSound('success');
                        addProgress();
                        setTimeout(nextQuestion, 500);
                    } else {
                        btn.style.backgroundColor = 'var(--accent-red)';
                        playSound('error');
                        showHint();
                    }
                };
                grid.appendChild(btn);
            });
        }

        function showHint() {
            const hintBox = document.getElementById('hintBox');
            const additionStr = Array(currentMultiplier).fill(currentNumber).join(' + ');
            hintBox.innerHTML = `<strong>רמז:</strong><br><span style="direction:ltr; display:inline-block; font-weight:bold; font-size:1.5rem;">${additionStr}</span>`;
            hintBox.style.display = 'block';
        }

        function checkStage3() {
            if (!typedValue) return;
            const numVal = parseInt(typedValue, 10);
            const display = document.getElementById('numpadDisplay');
            
            if (numVal === currentAnswer) {
                display.style.backgroundColor = 'var(--accent-green)';
                playSound('success');
                addProgress();
                setTimeout(() => {
                    display.style.backgroundColor = '#0b1116';
                    nextQuestion();
                }, 500);
            } else {
                display.style.backgroundColor = 'var(--accent-red)';
                playSound('error');
                setTimeout(() => {
                    display.style.backgroundColor = '#0b1116';
                    typedValue = '';
                    display.textContent = '?';
                }, 500);
            }
        }

        // ================= מקלדת משותפת =================
        function pressPad(val) {
            playSound('pop');
            if (val === 'C') typedValue = '';
            else if (typedValue.length < 3) typedValue += val;
            document.getElementById('numpadDisplay').textContent = typedValue || '?';
        }

        function submitPad() {
            if (currentStage === 1) checkStage1();
            else if (currentStage === 3) checkStage3();
        }

        // ================= גלריית פוסטרים =================
        function openGallery() {
            playSound('pop');
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 10; i++) {
                const progress = playerStats.posters[i];
                const frame = document.createElement('div');
                frame.className = `poster-frame ${progress >= TOTAL_TILES ? 'unlocked' : ''}`;
                
                // תמונת הפוסטר
                const img = document.createElement('img');
                img.className = 'poster-image';
                img.src = `poster${i}.jpg`; // דורש לשמור קבצים אלו
                img.onerror = function() { this.style.display = 'none'; };
                frame.appendChild(img);

                // מספר הפוסטר במרכז אם לא הושלם
                if (progress < TOTAL_TILES) {
                    const overlay = document.createElement('div');
                    overlay.className = 'poster-overlay';
                    overlay.innerHTML = `<div class="poster-overlay-title">${i}</div>`;
                    frame.appendChild(overlay);
                    
                    // בניית האריחים שמסתירים
                    const tilesGrid = document.createElement('div');
                    tilesGrid.className = 'tiles-grid';
                    for (let t = 0; t < TOTAL_TILES; t++) {
                        const tile = document.createElement('div');
                        tile.className = 'puzzle-tile';
                        // אם האריח הזה נחשף לפי ההתקדמות, נשבור אותו מיד
                        if (t < progress) tile.classList.add('broken');
                        tilesGrid.appendChild(tile);
                    }
                    frame.appendChild(tilesGrid);
                }

                grid.appendChild(frame);
            }
            document.getElementById('galleryModal').classList.add('active');
        }

        function closeGallery() {
            playSound('pop');
            document.getElementById('galleryModal').classList.remove('active');
        }

        initHome();
    </script>
</body>
</html>
